[package]
name = "mettgine"
version = "0.6.0"
edition = "2021"
description = "Mettgine - Engine der Mett-Gaming-Spiele (Vulkan, Animation, Absturzberichte)"

[dependencies]
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
font8x8 = "0.3"
# Schrift-Atlas aus TTF (text)
ab_glyph = "0.2"
# Startbild entpacken (splash)
png = "0.17"
# Controller (input)
gilrs = "0.11"
# Audio-Wiedergabe (audio)
rodio = { version = "0.19", default-features = false }
# Mehrspieler ueber den Mett Launcher (net::mett)
mett-net = { git = "https://github.com/Mett-Gaming/mett-launcher", tag = "v0.2.1", optional = true }
# Modelle im glTF-Format (asset::gltf)
gltf = { version = "1.4", optional = true, default-features = false, features = ["import", "utils", "names", "KHR_materials_emissive_strength"] }
# Bilder (asset::image)
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }

# Physik (physics)
rapier3d = { version = "0.36", optional = true }
# Entity-Component-System (ecs)
hecs = { version = "0.11", optional = true }

[features]
# Was ohne weitere Angaben dabei ist. Alles andere schaltet ein Spiel in seiner Cargo.toml ein:
# mettgine = { path = "mettgine", features = ["gltf"] }
default = ["mett-net"]
mett-net = ["dep:mett-net"]
images = ["dep:image"]
gltf = ["dep:gltf", "images"]
# Klangdateien (audio::mixer::decode)
audio-files = ["rodio/wav", "rodio/vorbis", "rodio/symphonia-mp3"]
ecs = ["dep:hecs"]
physics = ["dep:rapier3d"]
# alles
full = ["mett-net", "gltf", "images", "audio-files", "ecs", "physics"]

[build-dependencies]
naga = { version = "24", features = ["wgsl-in", "spv-out"] }

[package]
name = "mettgine"
version = "0.1.0"
edition = "2021"
description = "Mettgine - Engine der Mett-Gaming-Spiele (Vulkan, Animation, Absturzberichte)"

[dependencies]
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
font8x8 = "0.3"

[build-dependencies]
naga = { version = "24", features = ["wgsl-in", "spv-out"] }

[package]
name = "mettpack"
version = "0.1.0"
edition = "2021"
description = "Prueft und packt ein Spiel mit Mettgine (siehe docs/pakete.md)"

[dependencies]
mpak = { path = "../mpak" }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# nur Lesen von spiel.toml
toml = { version = "0.8", default-features = false, features = ["parse"] }

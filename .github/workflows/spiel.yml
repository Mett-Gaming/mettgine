# Gemeinsamer Bau der Spiele: prüfen, testen, bauen, packen, bei Versionsmarken veröffentlichen.
# Ein Spiel ruft ihn mit wenigen Zeilen auf (siehe docs/pakete.md), fest auf eine Engine-Marke gelegt.
name: Spiel

on:
  workflow_call:
    inputs:
      titel:
        description: Name in der Veröffentlichung, z. B. KASSE 0
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Mettgine liegt als Untermodul in mettgine/
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Prüfen
        run: cargo run --release -q -p mettpack -- pruefen

      - name: Tests
        run: cargo test --release

      - name: Bauen und packen
        run: cargo run --release -q -p mettpack -- packen

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.dateien.json

      - name: Veröffentlichung anlegen (nur bei Marken v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TITEL: ${{ inputs.titel }}
          MARKE: ${{ github.ref_name }}
        shell: pwsh
        run: |
          # Betas (vX.Y.Z-beta.N) als Vorabversion: die bekommt im Launcher nur, wer den Kanal
          # eingeschaltet hat
          $extra = @()
          if ($env:MARKE -match '-') { $extra += '--prerelease' }
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -like "*-$env:MARKE.zip" -or $_.Name -like "*-$env:MARKE.dateien.json" }
          if ($files.Count -ne 2) { throw "Erwartet: Zip und Dateiliste, gefunden: $($files.Name)" }
          gh release create $env:MARKE $files.FullName --title "$env:TITEL $env:MARKE" --generate-notes @extra
